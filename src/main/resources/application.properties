spring.application.name=Trading-Platform-API
spring.config.import=optional:file:.env.properties

server.port=5454

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tradingplatform
spring.datasource.username=${MYSQLDB_USER}
spring.datasource.password=${MYSQLDB_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Specify explicitly the dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Disable Hibernate usage of JDBC metadata
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Database initialization should typically be performed outside of Spring lifecycle
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
#spring.jpa.show-sql: true

# Razorpay API Keys
razorpay.api.key=${RAZOR_PAY_API_KEY}
razorpay.api.secret=${RAZOR_PAY_API_SECRET}
